<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="486" viewBox="0 0 1280 486"><rect width="100%" height="100%" rx="16" fill="#101923"/><text x="32" y="38" font-family="sans-serif" font-size="18" fill="#8ed1be">Private Browser · recorded configuration-only demonstration</text><text x="32" y="65" font-family="sans-serif" font-size="15" fill="#b4c1ce">Synthetic credentials · Docker discovery/port checks simulated · no VPN started</text><text x="32" y="103" font-family="monospace" font-size="17" fill="#e6edf3">$ ./setup.sh --configure-only</text><text x="32" y="125" font-family="monospace" font-size="17" fill="#e6edf3">Private Browser setup — Proton VPN on Linux x86-64.</text><text x="32" y="147" font-family="monospace" font-size="17" fill="#e6edf3">Your VPN credentials stay on this machine. Stopping erases the browser session.</text><text x="32" y="169" font-family="monospace" font-size="17" fill="#e6edf3">Existing files will be preserved. No host settings will be changed.</text><text x="32" y="191" font-family="monospace" font-size="17" fill="#e6edf3">Use a Proton WireGuard config downloaded from your own account.</text><text x="32" y="213" font-family="monospace" font-size="17" fill="#e6edf3">Only its private key and IPv4 address are imported; DNS, peers and hooks are not applied.</text><text x="32" y="235" font-family="monospace" font-size="17" fill="#e6edf3">The VPN server is selected by country using Gluetun’s Proton integration.</text><text x="32" y="257" font-family="monospace" font-size="17" fill="#e6edf3">Is this a Proton VPN configuration? [y/N] y</text><text x="32" y="279" font-family="monospace" font-size="17" fill="#e6edf3">Path to your WireGuard .conf file (keep it outside this repo): /tmp/user/1000/pb-onboarding-demo-</text><text x="32" y="301" font-family="monospace" font-size="17" fill="#e6edf3">lt6agzuk/provider.conf</text><text x="32" y="323" font-family="monospace" font-size="17" fill="#e6edf3">Exit country [Singapore]: Singapore</text><text x="32" y="345" font-family="monospace" font-size="17" fill="#e6edf3">Browser login username [browser]: browser</text><text x="32" y="367" font-family="monospace" font-size="17" fill="#e6edf3">Browser password (hidden; at least 12 characters):</text><text x="32" y="389" font-family="monospace" font-size="17" fill="#e6edf3">Repeat browser password:</text><text x="32" y="411" font-family="monospace" font-size="17" fill="#e6edf3">Local configuration is ready. Existing credentials were preserved.</text><text x="32" y="433" font-family="monospace" font-size="17" fill="#e6edf3">Nothing was built or started. Next: ./pb start</text></svg>
