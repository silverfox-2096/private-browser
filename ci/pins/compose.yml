# Version manifest, never started. The CI tools below run via `docker run` in
# .github/workflows/ci.yml and ci/fingerprint.sh, where Dependabot cannot see
# them; listing them here lets its docker-compose updater open bump PRs. The
# workflow and fingerprint.sh read each image reference from this file.
