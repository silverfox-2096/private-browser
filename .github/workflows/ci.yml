# CI: static analysis + image CVE scan for the private-browser stack.
# One workflow, one badge. It does NOT run verify.sh for real -- that needs a live VPN
# key and a running stack (see verify.sh / README). ci/test-scripts.sh runs verify.sh,
# update.sh, launch.sh and ci/fingerprint.sh against stubbed docker/curl to prove their
# FAILURE paths; ci/test-checks.mjs does the same for checks.mjs. The fingerprint job runs the browser
# without the VPN, so it checks what a page sees, never what leaks.
#
# SUPPLY-CHAIN NOTE: the `uses:` actions below are pinned to full commit SHAs
# (with a trailing `# vX.Y.Z` comment for readability). Tools run via
# `docker run`/`pipx` are pinned by image digest or version in ci/pins/, where
# Dependabot can bump them (.github/dependabot.yml). This keeps the pipeline
# reproducible and immune to a moving tag being repointed.

name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly re-scan so the Trivy/CVE badge tracks upstream drift (base image,
    # Debian, Mozilla) even with no pushes. A red badge here = a fixable CVE has
    # appeared and `./update.sh` is overdue. Matches the README's monthly-maintenance ethos.
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: ShellCheck (preinstalled on the runner)
        run: shellcheck launch.sh update.sh verify.sh ci/fingerprint.sh ci/test-scripts.sh
      - name: Failure-path tests (docker/curl stubbed; no stack, no network)
        run: bash ci/test-scripts.sh
      - name: checks.mjs verdicts (browser + bash.ws stubbed; runner Node)
        run: node ci/test-checks.mjs

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Hadolint (via docker run; auto-reads .hadolint.yaml)
        run: |
          img=$(sed -n 's/^ *image: *\(hadolint\/.*\)/\1/p' ci/pins/compose.yml)
          docker run --rm -v "$PWD:/repo" -w /repo "${img:?no hadolint pin}" \
            hadolint Dockerfile.firefox

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Checkov (Dockerfile only -- Checkov has no docker-compose support)
        run: |
          pipx install "$(grep -x 'checkov==[0-9.]*' ci/pins/requirements.txt)"
          checkov -d . --framework dockerfile --quiet --compact

  kics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: KICS (docker-compose security scan)
        # KICS has native docker-compose support (Checkov does not). Passes clean today;
        # for any deliberate future finding (e.g. NET_ADMIN, the read-write htpasswd mount
        # -- both explained in the README) add `# kics-scan disable=<queryID>` lines to
        # docker-compose.yml with a rationale: the compose-side parallel to the
        # Dockerfile #checkov:skip's. Image pinned by tag + digest in ci/pins/compose.yml.
        run: |
          img=$(sed -n 's/^ *image: *\(checkmarx\/kics.*\)/\1/p' ci/pins/compose.yml)
          docker run --rm -v "$PWD:/path" "${img:?no kics pin}" \
            scan -p /path/docker-compose.yml --fail-on high --no-progress

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # image build + two scans is the only job that can hang
    permissions:
      contents: read
      security-events: write   # only this job needs it (SARIF upload)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Build the image Trivy will scan
        run: docker build -f Dockerfile.firefox -t private-firefox:ci .
      - name: Trivy -- gate on FIXABLE High/Critical only
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: private-firefox:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy -- full SARIF (all severities, never fails the job)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          image-ref: private-firefox:ci
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - name: Upload SARIF to the Security tab (keeps CVEs visible even when green)
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63   # v4.38.0
        with:
          sarif_file: trivy.sarif

  fingerprint:
    # What the image + compose prefs show a web page: UA, RFP time zone, WebGL off,
    # Safe Browsing prefs off, CreepJS fields vs ci/creep-baseline.json. No VPN key
    # needed; the browser runs on a plain bridge network (ci/compose.fingerprint.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - name: Fingerprint checks (headless Firefox + self-hosted CreepJS)
        run: bash ci/fingerprint.sh
      - name: Keep the raw CreepJS output when a check fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: fingerprint-out
          path: ci/out/
          if-no-files-found: ignore
