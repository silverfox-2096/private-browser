name: Companion image security
on:
  push:
  pull_request:
  schedule:
    - cron: "30 6 * * 1"
permissions:
  contents: read
concurrency:
  group: companion-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [gluetun, creepjs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and identify the exact Compose image
        env:
          SERVICE: ${{ matrix.service }}
          WIREGUARD_PRIVATE_KEY: unused-in-scan
          WIREGUARD_ADDRESSES: 10.2.0.2/32
          GLUETUN_API_KEY: unused-in-scan
        run: |
          docker compose --profile test config --format json > compose-resolved.json
          image=$(python3 -c 'import json,os; print(json.load(open("compose-resolved.json"))["services"][os.environ["SERVICE"]]["image"])')
          if [ "$SERVICE" = gluetun ]; then
            docker build --target test gluetun-patched
            BUILDX_METADATA_PROVENANCE=max docker buildx build --load --target candidate --metadata-file gluetun-build-metadata.json -t "$image" gluetun-patched
          else
            docker compose --profile test build --pull --no-cache creepjs
          fi
          image=$(docker image inspect "$image" --format '{{.Id}}')
          echo "SCAN_IMAGE=$image" >> "$GITHUB_ENV"
          # shellcheck disable=SC2016 # Markdown backticks are literal.
          printf '## %s\n\nImage: `%s`\n' "$SERVICE" "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Gate on fixable HIGH and CRITICAL vulnerabilities
        if: env.SCAN_IMAGE != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: companion-${{ matrix.service }}.json
          exit-code: "1"
      - name: Retain complete findings at all severities
        if: always() && env.SCAN_IMAGE != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          scanners: vuln
          format: json
          output: companion-${{ matrix.service }}-full.json
          exit-code: "0"
      - name: Source-aware Go module update report
        if: always() && matrix.service == 'gluetun' && env.SCAN_IMAGE != ''
        run: |
          source_image=$(docker build --quiet --target source gluetun-patched)
          timeout 180 docker run --rm "$source_image" go list -mod=readonly -m -u -json all > gluetun-module-updates.json
          python3 ci/module-updates.py gluetun-module-updates.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve scan evidence even when the gate fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-${{ matrix.service }}
          path: |
            companion-${{ matrix.service }}.json
            companion-${{ matrix.service }}-full.json
            gluetun-build-metadata.json
            gluetun-module-updates.json
          if-no-files-found: warn
